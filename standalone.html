<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Multifaceted Goddesses (Standalone)</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: #0b0b10;
        color: rgba(255, 255, 255, 0.92);
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 18px;
      }
      a {
        color: #b8ffeb;
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.03);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- No build step: just run a local server and open this file. -->
    <script type="module">
      import React from "https://esm.sh/react@19.1.0";
      import { createRoot } from "https://esm.sh/react-dom@19.1.0/client";

      function App() {
        return (
          <main>
            <h1>The Multifaceted Goddesses</h1>
            <div className="card">
              <p>
                This is a standalone React page (no Vite / no npm). Edit{" "}
                <code>standalone.html</code> to change it.
              </p>
              <p>
                Tip: run <code>python3 -m http.server</code> and open{" "}
                <a href="/standalone.html">/standalone.html</a>.
              </p>
            </div>
          </main>
        );
      }

      createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
